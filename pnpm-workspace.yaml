# This file exists for one setting, and the `packages` key is here to keep the
# repository root OUT of the workspace.
#
# pnpm 11 fails an install when a dependency ships an install script that has
# not been approved, and the only place to approve one is `allowBuilds` here.
# There are three, all pulled in by @opennextjs/cloudflare and Next.js, and all
# needed for the Cloudflare deploy to work: esbuild, workerd, unrs-resolver.
# pnpm writes this block by itself with the placeholder value "set this to true
# or false" every time it finds an unapproved script, which is how it announced
# the three of them.
#
# But the file also marks the directory as a workspace root, and pnpm refuses to
# add a dependency to a workspace root without the -w flag. Cloudflare's Next.js
# setup runs exactly that command while configuring the project:
#
#   pnpm add --force @opennextjs/cloudflare@latest
#   ERR_PNPM_ADDING_TO_ROOT  ... run this command again with the -w flag
#
# It cannot use -w either, because it is wrangler's own migration step.
#
# `packages` matching nothing is what resolves the two. pnpm 10 requires the
# field to be non-empty — without it, the install stops with
#
#   ERROR  packages field missing or empty
#
# — and a pattern that matches no directory leaves the root outside the
# workspace, so `pnpm add` is an ordinary root install again. Nothing lives in
# apps/; the directory name is a placeholder, not a plan.
packages:
  - "apps/*"

allowBuilds:
  esbuild: true
  workerd: true
  unrs-resolver: true
